<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link data-trunk rel="copy-dir" href="res/" />
    <title>Super Snack Bros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            /*
            width: 336px;
            height: 262px;
            */
            overflow: hidden;
            background-color: #1a1a2e;
            color: #eee;
            font-family: system-ui, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100vw;
            height: 100vh;
        }
        h1 {
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <canvas id="game-canvas" width="336" height="262" />
</body>

</html>
